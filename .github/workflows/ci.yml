# =============================================================================
# ci.yml -- evaluate every machine and profile, lint, and the hermetic tests
#
# Purpose:      The same `task check`, `task lint` and `task test` as on a
#               laptop, with Docker as the container engine: every machine
#               file and every profile evaluates to its system closure in
#               the pinned nixos/nix image, the Nix sources are formatted,
#               the declaration rules fail the way they should, the zsh
#               sources parse and carry their banners, and the four
#               hermetic smoke tests pass.
# Depends on:   Taskfile.yml (ENGINE=docker); the nixos/nix image pinned
#               there; zsh, jq and GNU grep as ggrep on the runner.
# Side effects: none outside the ephemeral runner.
# =============================================================================
#
# COVERS: an option typo, an unaccounted switch in any profile, a failed
#   assertion, an unformatted .nix file, a zsh file that does not parse or
#   lacks its banner, a hardcoded Homebrew prefix, the orphan-link and
#   tap-trust scanners, the ai checkout and repo-sync scripts.
# DOES NOT COVER (a Mac only): the switch and its activation scripts, brew
#   bundle, the live shell (shell-startup, shell:startup-time), task validate
#   and task audit.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check, lint, test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENGINE: docker
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: go-task/setup-task@v2.2.0
        with:
          version: 3.x

      # tasks/lint.zsh and the smoke tests are zsh and call GNU grep by its
      # Homebrew name, ggrep
      - name: zsh, jq, ggrep
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zsh jq
          sudo ln -sf "$(command -v grep)" /usr/local/bin/ggrep

      - run: task check
      - run: task lint
      - run: task test
