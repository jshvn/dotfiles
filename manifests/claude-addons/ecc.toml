# manifests/claude-addons/ecc.toml -- Everything Claude Code, trimmed install
#
# See docs/CLAUDE-ADDONS.md for the schema reference + lifecycle.
# See manifests/claude-addons/README.md for the directory-local quick-reference.
#
# Hybrid install (not the marketplace plugin). The full ecc@ecc plugin injects
# its entire payload -- hundreds of skills, dozens of agents and commands, and
# always-on hooks -- into every session, an untrimmable context tax on the
# plugin path. Instead:
#
#   - The ecc *marketplace* stays registered: its clone at
#     plugins/marketplaces/ecc is where install.sh lives, and
#     `claude plugin marketplace update ecc` is the upgrade fetch.
#   - install.sh copies the `minimal` profile into ~/.claude/ (hardcoded
#     upstream target): workflow skills and agents.
#     `--without baseline:commands` drops the legacy slash-command shims
#     (skills cover the same workflows); `--without baseline:rules` drops the
#     always-on rules tree (generic guidance Claude 5 does not need).
#   - Symlinks expose skills/agents inside $XDG_CONFIG_HOME/claude/ where
#     Claude Code actually reads them (CLAUDE_CONFIG_DIR, set in .zshenv):
#     one flat link per keep-list skill plus a single agents/ecc dir link.
#     They land in the repo working tree via the claude/ symlink and are
#     listed in .git/info/exclude (machine-local).
#   - No settings fragment: the addon registers zero hooks. Session
#     continuity is native auto-memory; no node spawns on start/stop/compact.
#
# Never `claude plugin install ecc@ecc` on top of this -- duplicate skills and
# hook conflicts (upstream hard rule: don't stack install methods).

schema_version = 1

[meta]
name        = "ecc"
description = "Everything Claude Code -- minimal profile pruned to the skill and agent keep-lists; registers no hooks"
upstream    = "https://github.com/affaan-m/everything-claude-code"

[install]
# ln -sfn (not _:safe-link) is deliberate: helpers.yml tasks are internal and
# not CLI-invocable from addon commands; -sfn carries the same idempotent
# re-link semantics. LINT-03b scopes to taskfiles/*.yml and does not apply
# here. install.sh writes skills flat into ~/.claude/skills/. The bridge
# links an explicit keep-list, not the whole payload: every linked skill's
# description loads into every session, so the link set is the context
# budget. Each run unlinks all links targeting ~/.claude/skills/ then
# relinks the keep-list, which converges a machine down when a name is
# dropped; a keep-list name missing from the payload logs to stderr instead
# of leaving a dangling link. The links land in the repo working tree
# via the links.yml claude/ symlinks, so each one is appended to
# .git/info/exclude (machine-local, like the gsd-* entries). No mkdir:
# $XDG_CONFIG_HOME/claude/{skills,agents} are links.yml-owned symlinks that
# exist before this runs in the `task install` pipeline; if they are missing,
# failing loudly beats creating a real dir that would preempt
# links:install-claude.
commands = [
  "claude plugin marketplace add https://github.com/affaan-m/everything-claude-code.git",
  "bash \"${XDG_CONFIG_HOME:-$HOME/.config}/claude/plugins/marketplaces/ecc/install.sh\" --target claude --profile minimal --without baseline:commands --without baseline:rules",
  "rm -f \"$HOME/.claude/AGENTS.md\"",
  "find \"$HOME/.claude/agents\" -maxdepth 1 -name '*.md' ! -name 'architect.md' ! -name 'build-error-resolver.md' ! -name 'code-explorer.md' ! -name 'code-reviewer.md' ! -name 'code-simplifier.md' ! -name 'doc-updater.md' ! -name 'planner.md' ! -name 'python-reviewer.md' ! -name 'refactor-cleaner.md' ! -name 'security-reviewer.md' ! -name 'typescript-reviewer.md' -delete",
  "find \"${XDG_CONFIG_HOME:-$HOME/.config}/claude/skills/\" -maxdepth 1 -type l | while read -r l; do case \"$(readlink \"$l\")\" in \"$HOME/.claude/skills/\"*) rm -f \"$l\";; esac; done",
  "for s in agent-sort architecture-decision-records code-tour codebase-onboarding config-gc context-budget council skill-scout; do if [ -d \"$HOME/.claude/skills/$s\" ]; then ln -sfn \"$HOME/.claude/skills/$s\" \"${XDG_CONFIG_HOME:-$HOME/.config}/claude/skills/$s\"; else echo \"ecc: keep-list skill '$s' absent from payload -- skipped\" >&2; fi; done",
  "ln -sfn \"$HOME/.claude/agents\" \"${XDG_CONFIG_HOME:-$HOME/.config}/claude/agents/ecc\"",
  "grep -qxF 'claude/agents/ecc' \"$DOTFILEDIR/.git/info/exclude\" || echo 'claude/agents/ecc' >> \"$DOTFILEDIR/.git/info/exclude\"",
  "find \"$DOTFILEDIR/claude/skills\" -maxdepth 1 -type l | while read -r l; do case \"$(readlink \"$l\")\" in \"$HOME/.claude/skills/\"*) grep -qxF \"claude/skills/$(basename \"$l\")\" \"$DOTFILEDIR/.git/info/exclude\" || echo \"claude/skills/$(basename \"$l\")\" >> \"$DOTFILEDIR/.git/info/exclude\";; esac; done",
]
self_healing = false

[upgrade]
# Run instead of [install].commands when [verify] already passes -- preserves
# the always-pull-latest behavior of `task install`. Re-runs the link + git-
# exclude loops because an upstream update can add new skill directories.
commands = [
  "claude plugin marketplace update ecc",
  "bash \"${XDG_CONFIG_HOME:-$HOME/.config}/claude/plugins/marketplaces/ecc/install.sh\" --target claude --profile minimal --without baseline:commands --without baseline:rules",
  "rm -f \"$HOME/.claude/AGENTS.md\"",
  "find \"$HOME/.claude/agents\" -maxdepth 1 -name '*.md' ! -name 'architect.md' ! -name 'build-error-resolver.md' ! -name 'code-explorer.md' ! -name 'code-reviewer.md' ! -name 'code-simplifier.md' ! -name 'doc-updater.md' ! -name 'planner.md' ! -name 'python-reviewer.md' ! -name 'refactor-cleaner.md' ! -name 'security-reviewer.md' ! -name 'typescript-reviewer.md' -delete",
  "find \"${XDG_CONFIG_HOME:-$HOME/.config}/claude/skills/\" -maxdepth 1 -type l | while read -r l; do case \"$(readlink \"$l\")\" in \"$HOME/.claude/skills/\"*) rm -f \"$l\";; esac; done",
  "for s in agent-sort architecture-decision-records code-tour codebase-onboarding config-gc context-budget council skill-scout; do if [ -d \"$HOME/.claude/skills/$s\" ]; then ln -sfn \"$HOME/.claude/skills/$s\" \"${XDG_CONFIG_HOME:-$HOME/.config}/claude/skills/$s\"; else echo \"ecc: keep-list skill '$s' absent from payload -- skipped\" >&2; fi; done",
  "find \"$DOTFILEDIR/claude/skills\" -maxdepth 1 -type l | while read -r l; do case \"$(readlink \"$l\")\" in \"$HOME/.claude/skills/\"*) grep -qxF \"claude/skills/$(basename \"$l\")\" \"$DOTFILEDIR/.git/info/exclude\" || echo \"claude/skills/$(basename \"$l\")\" >> \"$DOTFILEDIR/.git/info/exclude\";; esac; done",
]

[verify]
# Installed iff the minimal-profile payload exists, the agents dir link
# resolves, and at least one flat skill link targets the ECC payload.
# (find -exec readlink | grep, not -lname: macOS/BSD find has no -lname.
# Trailing slash on the skills path: it is itself a links.yml symlink and
# BSD find does not follow a symlink operand without it.)
command = "test -f \"$HOME/.claude/ecc/install-state.json\" && test -d \"${XDG_CONFIG_HOME:-$HOME/.config}/claude/agents/ecc\" && find \"${XDG_CONFIG_HOME:-$HOME/.config}/claude/skills/\" -maxdepth 1 -type l -exec readlink {} ';' | grep -q \"^$HOME/.claude/skills/\""

[footprint]
# Only the agents dir link can be expressed as a glob; the flat skill links
# are identified by their target (they point into ~/.claude/skills/) and
# removed by the [remove] command below -- a name glob like skills/* would
# also match repo-owned skills.
file_globs  = ["agents/ecc"]
# Everything install.sh writes under ~/.claude/. ~/.claude/skills is NOT
# listed wholesale: it holds non-ECC runtime dirs, so the ECC-owned skill
# dirs are deleted per-name by the [remove] state-derived loop below.
# Runtime data ECC accumulated (session-data/, metrics/, *.log) is
# deliberately NOT listed -- session history is user data and survives
# addon removal.
extra_paths = [
  "$HOME/.claude/agents",
  "$HOME/.claude/rules/ecc",
  "$HOME/.claude/scripts",
  "$HOME/.claude/hooks",
  "$HOME/.claude/mcp-configs",
  "$HOME/.claude/ecc",
  "$HOME/.claude/skills/learned",
  "$HOME/.claude/.agents",
  "$HOME/.claude/AGENTS.md",
  "$HOME/.claude/PLUGIN_SCHEMA_NOTES.md",
  "$HOME/.claude/README.md",
  "$HOME/.claude/marketplace.json",
  "$HOME/.claude/plugin.json",
]

[remove]
# Marketplace is dedicated to ECC (single-plugin marketplace) -- remove it.
# The find loop deletes exactly the flat skill links that target the ECC
# payload (repo-owned skills are real dirs, untouched). The jq loop then
# deletes the ECC-owned skill dirs named in install-state.json, leaving
# non-ECC dirs in ~/.claude/skills untouched; it runs before extra_paths
# cleanup deletes the state file. Remaining file cleanup is handled by
# file_globs + extra_paths after these commands. Stale .git/info/exclude
# lines are left behind -- inert by definition (they only ever matched the
# links being deleted here).
commands = [
  "find \"${XDG_CONFIG_HOME:-$HOME/.config}/claude/skills/\" -maxdepth 1 -type l | while read -r l; do case \"$(readlink \"$l\")\" in \"$HOME/.claude/skills/\"*) rm -f \"$l\";; esac; done",
  "[ ! -f \"$HOME/.claude/ecc/install-state.json\" ] || jq -r --arg p \"$HOME/.claude/skills/\" '.operations[].destinationPath | select(startswith($p)) | ltrimstr($p) | split(\"/\")[0]' \"$HOME/.claude/ecc/install-state.json\" | sort -u | while read -r n; do rm -rf \"$HOME/.claude/skills/$n\"; done",
  "claude plugin marketplace remove ecc",
]
