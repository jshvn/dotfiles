# manifests/machines/work-laptop.toml -- Work MacBook.
#
# Self-contained; arch is auto-detected by the resolver.
#
# [packages] lists discretionary choices only -- applications wanted on this
# machine. Packages required by the dotfiles config itself are not listed here:
# unconditional tooling lives in manifests/base.toml, and a feature's own
# dependencies live on its flag in manifests/features.toml. Listing a package
# that base or an enabled flag already provides is a hard error.
#
# Schema reference: docs/MANIFEST.md.

schema_version = 3

[machine]
description = "Work MacBook -- work identity, GUI + dev environment"
os = "darwin"
identity = "work"

[features]
enabled = [
  "one-password-ssh",
  "one-password-signing",
  "claude-marketplace",
  "repo-auto-update",
  "repo-dev-toolchain",
  "ghostty",
  "vscode",
  "macos-dock",
  "macos-finder",
  "macos-input",
  "macos-screenshots",
  "macos-security",
  "macos-appearance",
  "macos-display",
]
disabled = [
  "herdr",
  "jgrid-net",
  "macos-spotlight",
  "server-include",
]

[packages]
# container: Apple's container runtime; requires macOS 15+.
formulae = [
  "bat",
  "bottom",
  "container",
  "doggo",
  "duf",
  "fd",
  "gh",
  "git-crypt",
  "htop",
  "hugo",
  "poppler",
  "uv",
  "wget",
]

casks = [
  "1password-cli",
  "alcove",
  "appcleaner",
  "cardhop",
  "claude-code",
  "fantastical",
  "firefox",
  "gitfox",
  "microsoft-excel",
  "microsoft-powerpoint",
  "microsoft-word",
  "miniconda",
  "raycast",
  "slack",
  "spotify",
  "standard-notes",
  "sublime-text",
  "zoom",
]

mas = [
  { id = 441258766, name = "Magnet" },
  { id = 904280696, name = "Things3" },
]
