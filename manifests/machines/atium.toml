# manifests/machines/atium.toml -- Mac atium, a mostly-headless Mac server.
#
# Usually headless but occasionally connected to a display, so it still wants
# the 1Password GUI and ghostty. The long disabled list is deliberate: the file
# itself records every flag this server does not want.
#
# [packages] lists discretionary choices only -- applications wanted on this
# machine. Packages required by the dotfiles config itself are not listed here:
# unconditional tooling lives in manifests/base.toml, and a feature's own
# dependencies live on its flag in manifests/features.toml. Listing a package
# that base or an enabled flag already provides is a hard error.
#
# Schema reference: docs/MANIFEST.md.

schema_version = 3

[machine]
description = "Mac atium -- mostly-headless Mac server"
os = "darwin"
identity = "atium"

[features]
enabled = [
  "repo-auto-update",
  "macos-security",
  "ghostty",
]
disabled = [
  "one-password-ssh",
  "one-password-signing",
  "claude-marketplace",
  "repo-dev-toolchain",
  "herdr",
  "vscode",
  "jgrid-net",
  "server-include",
  "macos-dock",
  "macos-finder",
  "macos-input",
  "macos-spotlight",
  "macos-screenshots",
  "macos-appearance",
  "macos-display",
]

[packages]
# 1password is listed here rather than arriving via one-password-ssh/-signing:
# identity/ssh/identities/atium uses the local system ssh-agent, not 1Password,
# so those flags stay off while the application itself is still wanted.
# container is intentionally absent -- it requires macOS 15+ and this machine
# runs Sonoma 14.
formulae = [
  "bat",
  "bottom",
  "doggo",
  "duf",
  "fd",
  "gh",
  "git-crypt",
  "htop",
  "hugo",
  "poppler",
  "wget",
]

casks = [
  "1password",
  "appcleaner",
  "cloudflare-warp",
  "dropbox",
  "miniconda",
  "orbstack",
]
