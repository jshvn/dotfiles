version: '3'

# The operator surface: thin wrappers around darwin-rebuild, nix eval and the pinned nix image.
# The machine is picked once with `task setup -- <name>` and never inferred from the hostname.
# Everything that reads state goes through one evaluation (SHAPE) piped to a script in tasks/.

set: [errexit, pipefail]
silent: true

env:
  # flakes on before the first switch writes them into /etc/nix/nix.conf
  NIX_CONFIG: 'experimental-features = nix-command flakes'

vars:
  STATE: '{{.XDG_STATE_HOME | default (printf "%s/.local/state" .HOME)}}/dotfiles'
  MACHINE:
    sh: cat '{{.STATE}}/machine' 2>/dev/null || true
  MACHINES:
    sh: for f in '{{.ROOT_DIR}}/machines'/*.nix; do b=${f##*/}; printf '%s ' "${b%.nix}"; done
  REBUILD: /run/current-system/sw/bin/darwin-rebuild
  COLD_START_BUDGET: 500
  # the official installer's profile, called by path: a Taskfile env cannot override the caller's PATH
  NIX: /nix/var/nix/profiles/default/bin/nix
  # Apple container when its daemon is up, else Docker; ENGINE=docker reproduces a CI run
  ENGINE:
    sh: |
      if [ -n "$ENGINE" ]; then echo "$ENGINE"
      elif command -v container >/dev/null 2>&1 && container system status >/dev/null 2>&1; then echo container
      elif command -v docker >/dev/null 2>&1; then echo docker
      else echo container
      fi
  IMAGE: nixos/nix:2.35.2@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c
  # root inside the image, because nix owns its store there; 4g because the evaluation dies at
  # exit 137 under Apple container's 1 GiB default; safe.directory (PRELUDE) because under
  # Docker the mount keeps the caller's uid and libgit2 refuses a repository root does not own
  CONTAINER: >-
    {{.ENGINE}} run --rm --memory 4g -v "{{.ROOT_DIR}}":/work -w /work
    -e NIX_CONFIG="$NIX_CONFIG" {{.IMAGE}}
  PRELUDE: git config --global --add safe.directory /work
  # The evaluated declaration every read-only task consumes: the dotfiles namespace (links,
  # profile, apps, system ...), every defaults group (wrapped in tryEval: nix-darwin keeps
  # removed groups such as alf that throw when touched; renamed keys such as dock's
  # expose-group-by-app are dropped, since reading one prints a trace), the ByHost keys, the
  # generated Brewfile plus a `vscode` line per apps.vscode.vsix extension (installed by an
  # activation step, so read back, kept by the cleanup and never fetched from the Marketplace),
  # taps, casks, the Homebrew prefix, the hostname, the text of /etc/zshenv and the Nix package.
  SHAPE: >-
    c: let safe = x: let r = builtins.tryEval (builtins.deepSeq x x); in if r.success then r.value else "<error>"; u = c.system.primaryUser; in {
      dotfiles = c.dotfiles;
      defaults = builtins.mapAttrs (n: safe) (c.system.defaults // { dock = removeAttrs c.system.defaults.dock [ "expose-group-by-app" ]; });
      currentHost = c.home-manager.users.${u}.targets.darwin.currentHostDefaults;
      loginShell = c.users.users.${u}.shell;
      brewfile = c.homebrew.brewfile + builtins.concatStringsSep "" (map (id: "vscode \"${id}\"\n") (builtins.attrNames (if c.dotfiles.apps.vscode.enable then c.dotfiles.apps.vscode.vsix else { })));
      taps = c.homebrew.taps;
      casks = c.homebrew.casks;
      brewPrefix = c.homebrew.prefix;
      hostName = c.networking.localHostName;
      zshenv = c.environment.etc.zshenv.text;
      nixPackage = c.nix.package.outPath;
    }
  EVAL: "{{.NIX}} eval --json '{{.ROOT_DIR}}#darwinConfigurations.{{.MACHINE}}.config' --apply '{{.SHAPE}}'"

tasks:
  default:
    desc: 'Print the menu'
    # ponytail: hand-maintained listing -- go-task can neither group nor annotate, so a new
    # task means a row below; menu-drift fails until it has one. `task --list` stays the
    # generated view.
    cmds:
      - |
        b= c= d= r=
        if [ -t 1 ] && [ -z "${NO_COLOR:-}" ]; then
          b=$(printf '\033[1m'); c=$(printf '\033[1;36m'); d=$(printf '\033[2m'); r=$(printf '\033[0m')
        fi
        group() { printf '\n%s   %s\n' "$c$1$r" "$d$2$r"; }
        row() {
          if [ ${#1} -le 26 ]; then printf '  %-26s %s\n' "$1" "$2"
          else printf '  %s\n  %-26s %s\n' "$1" '' "$2"; fi
          [ -z "${3:-}" ] || note "$3"
        }
        note() { printf '  %-26s %s\n' '' "$d$1$r"; }

        printf '\n%s   %s\n' "${b}dotfiles${r}" "${d}this Mac as one nix-darwin configuration${r}"

        group machines 'task setup -- <name> picks one; never inferred from the hostname'
        g=
        if [ -n "$r" ]; then g=$(printf '\033[32m'); fi
        machines='{{.MACHINES | trim}}'
        w=$(printf '%s\n' $machines | awk '{ if (length > w) w = length } END { print w }')
        for m in $machines; do
          p=$(sed -n 's|.*\.\./profiles/\([a-z0-9-]*\).*|\1|p' "{{.ROOT_DIR}}/machines/$m.nix")
          if [ "$m" = '{{.MACHINE}}' ]; then printf "  %-${w}s  %s  %s\n" "$m" "$p" "${g}selected${r}"
          else printf "  %-${w}s  %s\n" "$m" "$p"; fi
        done
        case " $machines " in
          *' {{.MACHINE}} '*) ;;
          *) printf '  %s\n' "${d}none selected: task setup -- <name>${r}" ;;
        esac

        group read 'looks at this Mac, changes nothing'
        row 'task show' 'The evaluated declaration: profile, system, apps, links, packages'
        row 'task diff' 'What install would change: closure diff, then what brew would add' 'builds the closure and leaves ./result (ignored)'
        row 'task validate' 'Read the whole declaration back from the live system' 'exits 1 on drift; run it after every install'
        row 'task audit' 'State beyond the declaration, and known CVEs' 'task prune uninstalls the packages it finds installed but not declared'

        group checks 'tests the files in this repo; the Nix steps run in a Linux container via {{.ENGINE}}'
        row 'task check' 'Evaluate every machine and profile, as CI does' 'git add -A first: the flake sees only tracked or staged files'
        row 'task lint' 'zsh parse, set -euo, banners, hardcoded prefixes, this menu; nix fmt --ci'
        row 'task test' 'Smoke tests and the negative evaluations' 'shell-startup and the {{.COLD_START_BUDGET}} ms cold-start budget run only on a Mac'
        row 'task fmt' 'Format every .nix file in place'

        group write 'changes this Mac'
        row 'task setup -- <name>' 'Select the machine'
        row 'task install' 'Fast-forward, build and switch, refresh plugins; never uninstalls' 'sudo prompts; ends with what task prune would remove and each stale pin'
        row 'task prune' 'Uninstall every package the declaration no longer lists; brew asks y/n' 'not only brew: App Store apps, VS Code extensions, go/cargo/uv/npm/krew tools'
        row 'task rollback' 'Activate the previous generation' 'sudo prompts'

        printf '\n%s\n\n' "${d}task --list is the generated view; ENGINE=docker forces Docker${r}"

  setup:
    desc: 'Persist the machine selection: task setup -- <name>'
    preconditions:
      - sh: test -f '{{.ROOT_DIR}}/machines/{{.CLI_ARGS}}.nix'
        msg: 'no machines/{{.CLI_ARGS}}.nix; the machines are: {{.MACHINES | trim}}'
    cmds:
      - mkdir -p '{{.STATE}}' && printf '%s' '{{.CLI_ARGS}}' > '{{.STATE}}/machine'
      - 'echo "machine: {{.CLI_ARGS}}"'

  install:
    desc: 'Fast-forward the checkout (warn-only), build and switch the selected machine (a first run on a Mac clears the way itself), list what is no longer declared, warn about each pin it does not move, refresh the zsh plugin bundles'
    preconditions: &need-machine
      - sh: test -f '{{.ROOT_DIR}}/machines/{{.MACHINE}}.nix'
        msg: 'no machine selected (no machines/{{.MACHINE}}.nix): task setup -- <name>; the machines are: {{.MACHINES | trim}}'
    cmds:
      - DOTFILEDIR='{{.ROOT_DIR}}' REPO_NAME=jshvn/dotfiles zsh '{{.ROOT_DIR}}/tasks/install-repo-sync.zsh'
      - '{{.EVAL}} | DOTFILEDIR="{{.ROOT_DIR}}" MACHINE={{.MACHINE}} NIX={{.NIX}} zsh "{{.ROOT_DIR}}/tasks/install.zsh"'
      # a login shell, because .zprofile puts Homebrew on the PATH and bootstrap's shell lacks it
      - zsh -lic 'antidote update --bundles' >/dev/null 2>&1 || echo "antidote update failed (offline?), bundles unchanged"

  prune:
    desc: 'Uninstall every formula, cask, tap, App Store app, VS Code extension and go/cargo/uv/npm/krew install the Brewfile does not list (brew asks first; no terminal, no uninstall)'
    preconditions: *need-machine
    cmds:
      - '{{.EVAL}} | zsh "{{.ROOT_DIR}}/tasks/prune.zsh"'

  rollback:
    desc: 'Activate the previous generation'
    cmds:
      - sudo {{.REBUILD}} --rollback

  show:
    desc: 'Print the evaluated declaration for the selected machine (profile, system, apps, links, packages)'
    preconditions: *need-machine
    cmds:
      - '{{.EVAL}} | jq .dotfiles'

  diff:
    desc: 'What install would change: the closure diff against the running generation, then the packages brew bundle would add'
    preconditions: *need-machine
    cmds:
      - '{{.REBUILD}} build --flake "{{.ROOT_DIR}}#{{.MACHINE}}" && {{.NIX}} store diff-closures /run/current-system ./result'
      - |
        bf=$(mktemp); trap 'rm -f "$bf"' EXIT
        {{.EVAL}} | jq -r .brewfile > "$bf"
        HOMEBREW_NO_AUTO_UPDATE=1 brew bundle check --no-upgrade --verbose --file="$bf" || true

  validate:
    desc: 'Read the whole declared state back from the live system (read-only; exits 1 on drift)'
    preconditions: *need-machine
    cmds:
      - '{{.EVAL}} | MACHINE={{.MACHINE}} DOTFILES_STATE="{{.STATE}}" zsh "{{.ROOT_DIR}}/tasks/validate.zsh"'

  audit:
    desc: 'State beyond the declaration and known CVEs (read-only; findings warn)'
    preconditions: *need-machine
    cmds:
      - '{{.EVAL}} | DOTFILES_STATE="{{.STATE}}" zsh "{{.ROOT_DIR}}/tasks/audit.zsh"'

  check:
    desc: 'Evaluate every machine and every profile inside the pinned nix image (CI runs the same)'
    cmds:
      - '{{.CONTAINER}} sh -c "{{.PRELUDE}} && nix flake check --no-write-lock-file"'

  lint:
    desc: 'Static checks: zsh parse, set -euo, banners, no hardcoded prefix, every task in the menu; Nix formatting via nix fmt'
    cmds:
      - zsh '{{.ROOT_DIR}}/tasks/lint.zsh'
      - task: menu-drift
      - '{{.CONTAINER}} sh -c "{{.PRELUDE}} && nix fmt --no-write-lock-file -- --ci"'

  fmt:
    desc: 'Format every .nix file in place with the flake formatter, inside the pinned nix image'
    cmds:
      - '{{.CONTAINER}} sh -c "{{.PRELUDE}} && nix fmt --no-write-lock-file"'

  test:
    desc: 'Smoke tests (orphan scan, trust scan, cleanup scan and link clearing, repo sync, pin check, ai checkout, VSIX install, the live shell and its cold-start budget on a Mac) and the negative evaluations'
    cmds:
      - for: [audit-brew-cleanup, audit-links, audit-trust, install-clear-links, install-repo-sync, install-pins, ai-checkout, vscode-vsix]
        cmd: DOTFILEDIR='{{.ROOT_DIR}}' zsh '{{.ROOT_DIR}}/tasks/tests/{{.ITEM}}.zsh'
      - '{{if eq OS "darwin"}}DOTFILEDIR="{{.ROOT_DIR}}" COLD_START_BUDGET={{.COLD_START_BUDGET}} zsh "{{.ROOT_DIR}}/tasks/tests/shell-startup.zsh"{{else}}echo "shell-startup: skipped, it needs the live Mac shell"{{end}}'
      - '{{.CONTAINER}} sh -c "{{.PRELUDE}} && SRC=/work bash tasks/tests/negative.sh"'

  # Every public task has a desc and a menu row, and every row names a task. default and
  # help are the menu itself. Needs task and jq wherever lint runs.
  menu-drift:
    internal: true
    cmds:
      - |
        rows=$(grep -oE "row ['\"]task [^ '\"]+" '{{.ROOT_TASKFILE}}' | sed -E "s/^row ['\"]task //" || true)
        bad=$(task -t '{{.ROOT_TASKFILE}}' --list-all --json --no-status | jq -r --arg rows "$rows" '
          ($rows | split("\n") | map(select(. != ""))) as $r
          | [.tasks[] | select(.task != "default" and .task != "help")] as $t
          | ($t[] | select(.desc == "") | "task \(.task): no desc; describe it or mark it internal"),
            ($t[] | select(.task | IN($r[]) | not) | "task \(.task): no row in the menu"),
            ($r[] | select(IN($t[].task) | not) | "row task \(.): no such task")')
        [ -z "$bad" ] || { printf '%s\n' "$bad" >&2; exit 1; }
