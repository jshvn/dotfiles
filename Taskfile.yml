version: '3'

# The operator surface: thin wrappers around darwin-rebuild, nix eval and the pinned nix image.
# The machine is picked once with `task setup -- <name>` and never inferred from the hostname.
# Everything that reads state goes through one evaluation (SHAPE) piped to a script in tasks/.

set: [errexit, pipefail]
silent: true

env:
  # flakes on before the first switch writes them into /etc/nix/nix.conf
  NIX_CONFIG: 'experimental-features = nix-command flakes'

vars:
  STATE: '{{.XDG_STATE_HOME | default (printf "%s/.local/state" .HOME)}}/dotfiles'
  MACHINE:
    sh: cat "${XDG_STATE_HOME:-$HOME/.local/state}/dotfiles/machine" 2>/dev/null || true
  MACHINES:
    sh: for f in '{{.ROOT_DIR}}/machines'/*.nix; do b=${f##*/}; printf '%s ' "${b%.nix}"; done
  REBUILD: /run/current-system/sw/bin/darwin-rebuild
  # the official installer's profile, called by path: a Taskfile env cannot override the caller's PATH
  NIX: /nix/var/nix/profiles/default/bin/nix
  # Apple container when its daemon is up, else Docker; ENGINE=docker reproduces a CI run
  ENGINE:
    sh: |
      if [ -n "$ENGINE" ]; then echo "$ENGINE"
      elif command -v container >/dev/null 2>&1 && container system status >/dev/null 2>&1; then echo container
      elif command -v docker >/dev/null 2>&1; then echo docker
      else echo container
      fi
  IMAGE: nixos/nix:2.35.2@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c
  # root inside the image, because nix owns its store there; 4g because the evaluation dies at
  # exit 137 under Apple container's 1 GiB default; safe.directory (PRELUDE) because under
  # Docker the mount keeps the caller's uid and libgit2 refuses a repository root does not own
  CONTAINER: >-
    {{.ENGINE}} run --rm --memory 4g -v "{{.ROOT_DIR}}":/work -w /work
    -e NIX_CONFIG='experimental-features = nix-command flakes' {{.IMAGE}}
  PRELUDE: git config --global --add safe.directory /work
  # The evaluated declaration every read-only task consumes: the dotfiles namespace (links,
  # identity, apps, system ...), every defaults group (wrapped in tryEval: nix-darwin keeps
  # removed groups such as alf that throw when touched), the ByHost keys, the generated
  # Brewfile, taps, casks, the Homebrew prefix and the hostname.
  SHAPE: >-
    c: let safe = x: let r = builtins.tryEval (builtins.deepSeq x x); in if r.success then r.value else "<error>"; in {
      dotfiles = c.dotfiles;
      defaults = builtins.mapAttrs (n: safe) c.system.defaults;
      currentHost = c.home-manager.users.josh.targets.darwin.currentHostDefaults;
      loginShell = c.users.users.josh.shell;
      brewfile = c.homebrew.brewfile;
      taps = c.homebrew.taps;
      casks = c.homebrew.casks;
      brewPrefix = c.homebrew.prefix;
      hostName = c.networking.localHostName;
    }
  EVAL: "{{.NIX}} eval --json '{{.ROOT_DIR}}#darwinConfigurations.{{.MACHINE}}.config' --apply '{{.SHAPE}}'"

tasks:
  default:
    desc: 'Print the operator surface'
    cmds:
      - |
        echo "dotfiles v3  machine: {{.MACHINE}}"
        echo
        echo "  change     setup -- <name>   install [-- --yes]   rollback"
        echo "  inspect    show   diff   validate   audit [-- --strict]   shell:startup-time"
        echo "  develop    check   lint   test   fmt"
        echo
        echo "task --list for descriptions"

  setup:
    desc: 'Persist the machine selection: task setup -- <name>'
    preconditions:
      - sh: test -f '{{.ROOT_DIR}}/machines/{{.CLI_ARGS}}.nix'
        msg: 'no machines/{{.CLI_ARGS}}.nix; the machines are: {{.MACHINES | trim}}'
    cmds:
      - mkdir -p '{{.STATE}}' && printf '%s' '{{.CLI_ARGS}}' > '{{.STATE}}/machine'
      - 'echo "machine: {{.CLI_ARGS}}"'

  install:
    desc: 'Fast-forward the checkout (warn-only), build and switch the selected machine (a first run on a Mac clears the way itself), uninstall what is no longer declared after asking (-- --yes answers yes), refresh the zsh plugin bundles'
    preconditions: &need-machine
      - sh: test -f '{{.ROOT_DIR}}/machines/{{.MACHINE}}.nix'
        msg: 'no machine selected (no machines/{{.MACHINE}}.nix): task setup -- <name>; the machines are: {{.MACHINES | trim}}'
    cmds:
      - DOTFILEDIR='{{.ROOT_DIR}}' REPO_NAME=jshvn/dotfiles zsh '{{.ROOT_DIR}}/apps/claude-code/repo-sync.zsh'
      - '{{.EVAL}} | DOTFILEDIR="{{.ROOT_DIR}}" MACHINE={{.MACHINE}} NIX={{.NIX}} zsh "{{.ROOT_DIR}}/tasks/install.zsh" {{.CLI_ARGS}}'
      # a login shell, because .zprofile puts Homebrew on the PATH and bootstrap's shell lacks it
      - zsh -lic 'antidote update --bundles' >/dev/null 2>&1 || echo "antidote update failed (offline?), bundles unchanged"

  rollback:
    desc: 'Activate the previous generation'
    cmds:
      - sudo {{.REBUILD}} --rollback

  show:
    desc: 'Print the evaluated declaration for the selected machine (identity, system, apps, links, packages)'
    preconditions: *need-machine
    cmds:
      - '{{.EVAL}} | jq .dotfiles'

  diff:
    desc: 'What install would change: the closure diff against the running generation, then the packages brew bundle would add'
    preconditions: *need-machine
    cmds:
      - '{{.REBUILD}} build --flake "{{.ROOT_DIR}}#{{.MACHINE}}" && {{.NIX}} store diff-closures /run/current-system ./result'
      - |
        bf=$(mktemp); trap 'rm -f "$bf"' EXIT
        {{.EVAL}} | jq -r .brewfile > "$bf"
        HOMEBREW_NO_AUTO_UPDATE=1 brew bundle check --no-upgrade --verbose --file="$bf" || true

  validate:
    desc: 'Read the whole declared state back from the live system (read-only; exits 1 on drift)'
    preconditions: *need-machine
    cmds:
      - '{{.EVAL}} | MACHINE={{.MACHINE}} zsh "{{.ROOT_DIR}}/tasks/validate.zsh"'

  audit:
    desc: 'State beyond the declaration and known CVEs (read-only; -- --strict exits 1 on findings)'
    preconditions: *need-machine
    cmds:
      - '{{.EVAL}} | zsh "{{.ROOT_DIR}}/tasks/audit.zsh" {{.CLI_ARGS}}'

  shell:startup-time:
    desc: 'Measure cold interactive zsh startup time (fails above {{.COLD_START_BUDGET}} ms)'
    vars:
      COLD_START_BUDGET: 500
    cmds:
      - |
        out=$(mktemp); trap 'rm -f "$out"' EXIT
        hyperfine --warmup 1 --runs 5 --export-json "$out" 'zsh -lic exit' >/dev/null 2>&1
        ms=$(jq -r '.results[0].mean * 1000 | floor' "$out")
        echo "cold shell start: ${ms} ms (budget {{.COLD_START_BUDGET}} ms)"
        test "$ms" -le {{.COLD_START_BUDGET}}

  check:
    desc: 'Evaluate every machine and every profile inside the pinned nix image (CI runs the same)'
    cmds:
      - '{{.CONTAINER}} sh -c "{{.PRELUDE}} && nix flake check --no-write-lock-file"'

  lint:
    desc: 'Static checks: zsh parse, set -euo, banners, no hardcoded prefix; Nix formatting via nix fmt'
    cmds:
      - zsh '{{.ROOT_DIR}}/tasks/lint.zsh'
      - '{{.CONTAINER}} sh -c "{{.PRELUDE}} && nix fmt --no-write-lock-file -- --ci"'

  fmt:
    desc: 'Format every .nix file in place with the flake formatter, inside the pinned nix image'
    cmds:
      - '{{.CONTAINER}} sh -c "{{.PRELUDE}} && nix fmt --no-write-lock-file"'

  test:
    desc: 'Smoke tests (orphan scan, trust scan, cleanup scan and link clearing, repo sync, ai checkout, the live shell on a Mac) and the negative evaluations'
    cmds:
      - for: [links-audit, packages-trust, install, repo-sync, ai-checkout]
        cmd: DOTFILEDIR='{{.ROOT_DIR}}' zsh '{{.ROOT_DIR}}/tasks/tests/{{.ITEM}}.zsh'
      - '{{if eq OS "darwin"}}DOTFILEDIR="{{.ROOT_DIR}}" zsh "{{.ROOT_DIR}}/tasks/tests/shell-startup.zsh"{{else}}echo "shell-startup: skipped, it needs the live Mac shell"{{end}}'
      - '{{.CONTAINER}} sh -c "{{.PRELUDE}} && SRC=/work bash tasks/tests/negative.sh"'
