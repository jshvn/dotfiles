version: '3'

# =============================================================================
# taskfiles/claude.yml -- Claude Code CLI + settings.json composition
#
# Purpose:      Ensure the claude CLI is installed, expose a show diagnostic,
#               and own the settings.d -> settings.json composition pipeline.
#               Marketplace/plugin lifecycle lives in taskfiles/claude-addons.yml
#               (one addon per manifests/claude-addons/<name>.toml).
# Depends on:   taskfiles/helpers.yml; install/messages.zsh;
#               :manifest:resolve (deps); claude + jq CLIs (ensure-cli gate).
# Side effects: writes $XDG_STATE_HOME/dotfiles/build/settings.json from the
#               two fragment dirs + preserved CLI-managed keys (compose), then
#               installs it over $XDG_CONFIG_HOME/claude/settings.json
#               (activate). Both writes are atomic (mktemp + mv).
# =============================================================================

includes:
  _: ./helpers.yml

vars:
  # Live file the Claude CLI reads and writes. A real file, not a symlink --
  # activation mv's the built artifact over it. Compose reads the CLI-managed
  # keys back out of it (the CLI writes them here; that cannot be prevented).
  SETTINGS_PATH:    '{{.XDG_CONFIG_HOME}}/claude/settings.json'
  # Composed artifact: a pure function of the two fragment dirs + preserved
  # keys. Nothing writes it but claude:settings-compose.
  SETTINGS_BUILD:   '{{.STATE_DIR}}/build/settings.json'
  # Repo-owned fragment source.
  SETTINGS_D:       '{{.ROOT_DIR}}/claude/settings.d'
  # Machine-generated addon fragments (99-addon-<name>.json). May not exist:
  # a machine with no addons never creates it, and the compose helper
  # tolerates a missing dir.
  SETTINGS_STATE_D: '{{.STATE_DIR}}/settings.d'

tasks:

  install:
    desc: "Ensure claude CLI present + recompose settings.json"
    internal: true
    deps: [":manifest:resolve"]
    # Feature gate via status: block (not split-cmd {{if}}/{{end}} -- go-task
    # parses each cmds entry as an independent template).
    status:
      - '{{if index .MANIFEST.features "claude-marketplace"}}false{{else}}true{{end}}'
    cmds:
      - task: ensure-cli
      - task: settings-compose
      - task: activate
      - |
        {{.DOTFILES_MESSAGES}}
        success "claude: CLI + settings.json ready"

  # lint-allow: cmds-without-status
  show:
    desc: "Show installed marketplaces + plugins (diagnostic)"
    status: [false]
    cmds:
      - claude plugin marketplace list
      - echo
      - claude plugin list

  # lint-allow: cmds-without-status
  validate:
    desc: "Validate Claude install state (CLI presence + settings.json drift check)"
    internal: true
    deps: [":manifest:resolve"]
    status: [false]
    cmds:
      - |
        {{.DOTFILES_MESSAGES}}
        # Emit sentinel + exit 0 when claude-marketplace is off so the root
        # `task validate` aggregator can render this row as `n/a`. Sentinel
        # substring "feature disabled -- skipped" is contract-bound across all
        # feature-disabled emitters and matched verbatim by the aggregator
        # summary block.
        {{if not (index .MANIFEST.features "claude-marketplace")}}
        info "claude: feature disabled -- skipped"
        exit 0
        {{end}}
        # Missing CLIs are hard failures. Track via $rc and exit non-zero at
        # the end of this block so the root validate aggregator renders the
        # row as `cross`.
        rc=0
        if command -v claude >/dev/null 2>&1; then
          check "claude CLI installed"
        else
          cross "claude CLI missing -- run 'task packages:install' first"
          rc=1
        fi
        if command -v jq >/dev/null 2>&1; then
          check "jq installed"
        else
          cross "jq missing -- run 'task packages:install' first"
          rc=1
        fi
        exit "$rc"
      - task: audit

  ensure-cli:
    internal: true
    desc: "Hard-fail if claude or jq missing"
    # Explicit `[[ $missing -eq 0 ]]` as final expression so the task exits
    # non-zero regardless of shell flags.
    status:
      - command -v claude >/dev/null 2>&1
      - command -v jq >/dev/null 2>&1
    cmds:
      - |
        {{.DOTFILES_MESSAGES}}
        missing=0
        if ! command -v claude >/dev/null 2>&1; then
          cross "claude CLI not found -- run 'task packages:install' first"
          missing=1
        fi
        if ! command -v jq >/dev/null 2>&1; then
          cross "jq not found -- run 'task packages:install' first"
          missing=1
        fi
        [[ $missing -eq 0 ]]

  # lint-allow: cmds-without-status
  settings-compose:
    desc: "Compose the settings.json build artifact from fragments + preserved CLI keys"
    internal: true
    summary: |
      The realize stage of the claude domain: pure, writes only into the
      state tree. claude:activate installs the result over the live file.

      Algorithm:
        1. Read the live settings.json and extract enabledPlugins,
           extraKnownMarketplaces, model, and tui (CLI-managed -- compose
           preserves them rather than overwriting).
        2. jq deep-merge every claude/settings.d/*.json in numeric sort
           order, then every $XDG_STATE_HOME/dotfiles/settings.d/*.json
           (later fragments override earlier ones on key conflict; array-
           typed values are replaced, not concatenated -- matches the resolver
           pass-1 semantics).
        3. Layer preserved CLI-managed keys over the composed object.
        4. Atomic write (mktemp + mv) into
           $XDG_STATE_HOME/dotfiles/build/settings.json.
    # Always-runs by design -- the compose pipeline is fast (<100ms typical)
    # and idempotent: same fragments + same preserved keys produce a
    # byte-identical artifact.
    status: [false]
    cmds:
      - |
        {{.DOTFILES_MESSAGES}}
        source '{{.ROOT_DIR}}/install/compose-settings.zsh'
        set -euo pipefail
        live='{{.SETTINGS_PATH}}'
        built='{{.SETTINGS_BUILD}}'
        settings_d='{{.SETTINGS_D}}'
        state_d='{{.SETTINGS_STATE_D}}'
        mkdir -p "$(dirname "$built")"

        # Phase 1: preserve CLI-managed keys from the live file (model is
        # CLI-managed via the /model command, tui via the fullscreen toggle;
        # each carried over only when present). This is the one read of the
        # live system in the realize stage: the Claude CLI writes those keys
        # there and nothing can redirect it.
        # settings_preserved_keys / settings_compose_fragments live in
        # install/compose-settings.zsh, shared with claude:audit.
        preserved=$(settings_preserved_keys "$live")

        # Phase 2: glob-guard. compgen returns non-zero when no matches; without
        # this check a literal "$settings_d/*.json" would reach jq and fail.
        if ! ls "$settings_d"/*.json >/dev/null 2>&1; then
          cross "claude:settings-compose: no fragments at ${settings_d}/*.json"
          exit 1
        fi

        # Phase 3: deep-merge fragments + layer preserved CLI keys. jq -s
        # reads all input files into an array; reduce merges them in argv
        # order (numeric filename prefix = merge priority); final * applies
        # the preserved keys on top.
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        if ! settings_compose_fragments "$settings_d" "$state_d" "$preserved" > "$tmp"; then
          cross "claude:settings-compose: jq deep-merge failed"
          exit 1
        fi

        # Sanity check: composed output must be valid JSON with at least the
        # repo's own permissions/hooks keys. Empty or malformed output would
        # brick the live config once activated.
        if ! jq -e '.permissions and .hooks' "$tmp" >/dev/null 2>&1; then
          cross "claude:settings-compose: composed output missing required keys (.permissions, .hooks)"
          exit 1
        fi

        mv "$tmp" "$built"
        trap - EXIT
        fragment_count=$( { ls "$settings_d"/*.json 2>/dev/null; ls "$state_d"/*.json 2>/dev/null; } | wc -l | tr -d ' ')
        check "build/settings.json composed from ${fragment_count} fragment(s)"

  # lint-allow: cmds-without-status
  activate:
    desc: "Install the built settings.json over the live file"
    internal: true
    status: [false]
    cmds:
      - |
        {{.DOTFILES_MESSAGES}}
        set -euo pipefail
        built='{{.SETTINGS_BUILD}}'
        live='{{.SETTINGS_PATH}}'
        if [[ ! -f "$built" ]]; then
          cross "claude:activate: $built missing -- run claude:settings-compose"
          exit 1
        fi
        mkdir -p "$(dirname "$live")"
        # mktemp + mv, never cp onto $live: cp follows a symlink and writes
        # through to its target. mv replaces the directory entry instead, so
        # a $live left over as a symlink from an earlier layout becomes a
        # real file rather than clobbering whatever it pointed at.
        tmp=$(mktemp "$(dirname "$live")/.settings.XXXXXX")
        trap 'rm -f "$tmp"' EXIT
        cat "$built" > "$tmp"
        chmod 644 "$tmp"
        mv "$tmp" "$live"
        trap - EXIT
        check "settings.json activated"

  # lint-allow: cmds-without-status
  diff:
    desc: "Preview settings.json changes: built artifact vs live file"
    # deps the single artifact this domain reads (see packages:diff).
    deps: [settings-compose]
    status: [false]
    # Same comparison as claude:audit; the difference is the exit contract --
    # diff always exits 0 and prints the patch, audit exits non-zero on drift.
    cmds:
      - |
        {{.DOTFILES_MESSAGES}}
        {{if not (index .MANIFEST.features "claude-marketplace")}}
        info "claude: feature disabled -- skipped"
        exit 0
        {{end}}
        built='{{.SETTINGS_BUILD}}'
        live='{{.SETTINGS_PATH}}'
        if [[ ! -f "$live" ]]; then
          info "claude: settings.json would be created"
          exit 0
        fi
        if diff -q <(jq -S . "$built") <(jq -S . "$live") >/dev/null 2>&1; then
          check "claude: settings.json current"
        else
          info "claude: settings.json would change (< live | > built):"
          diff <(jq -S . "$live") <(jq -S . "$built") || true
        fi

  # lint-allow: cmds-without-status
  audit:
    desc: "Check the live settings.json for drift vs the composed artifact"
    # deps on the realize stage rather than composing inline: settings-compose
    # writes only into the state tree, never the live system, so this stays
    # read-only with respect to the machine.
    deps: [settings-compose]
    status: [false]
    cmds:
      - |
        {{.DOTFILES_MESSAGES}}
        set -euo pipefail
        built='{{.SETTINGS_BUILD}}'
        live='{{.SETTINGS_PATH}}'

        if [[ ! -f "$live" ]]; then
          cross "claude:audit: $live does not exist -- run 'task install'"
          exit 1
        fi

        # -S sorts keys on both sides so the diff ignores key order.
        if diff -q <(jq -S . "$built") <(jq -S . "$live") >/dev/null; then
          check "settings.json matches the composed artifact (no drift)"
        else
          cross "settings.json DRIFT detected vs composed fragments"
          echo "--- diff: < live | > composed ---" >&2
          diff <(jq -S . "$live") <(jq -S . "$built") >&2 || true
          echo "--- run 'task install' to fix ---" >&2
          exit 1
        fi
