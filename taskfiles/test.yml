version: '3'

# =============================================================================
# taskfiles/test.yml -- smoke-test surface
#
# Purpose:      Hook smoke tests (install/tests/hooks.zsh) plus manifest
#               deep-merge fixtures and shell-startup smoke tests. Composed
#               by the root `task test` aggregator.
# Depends on:   install/tests/hooks.zsh; install/resolver.zsh;
#               install/tests/shell-startup.zsh; install/messages.zsh;
#               manifests/tests/fixtures/.
# Side effects: temporary copies under manifests/machines/ (negative
#               fixtures) -- always cleaned up via EXIT trap.
# =============================================================================

tasks:

  # lint-allow: cmds-without-status
  hooks:
    desc: "Run Claude hook smoke tests via install/tests/hooks.zsh"
    internal: true
    cmds:
      - |
        {{.DOTFILES_MESSAGES}}
        info "running hook smoke tests"
        export DOTFILEDIR="{{.ROOT_DIR}}"
        zsh "${DOTFILEDIR}/install/tests/hooks.zsh"
    status:
      - false

  # lint-allow: cmds-without-status
  repo-sync:
    desc: "Run repo:sync fast-forward smoke tests via install/tests/repo-sync.zsh"
    internal: true
    cmds:
