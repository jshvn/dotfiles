version: '3'

# =============================================================================
# taskfiles/packages.yml -- manifest-driven brew + cask + mas package layer
#
# Purpose:      Reads packages.brew.* from resolved.json, composes the
#               per-machine Brewfile to $XDG_STATE_HOME/dotfiles/build/Brewfile,
#               refreshes brew metadata, runs `brew bundle install --upgrade`,
#               and verifies post-install state.
# Depends on:   taskfiles/helpers.yml; install/messages.zsh;
#               install/compose-brewfile.zsh; :manifest:resolve (deps).
# Side effects: writes $XDG_STATE_HOME/dotfiles/build/Brewfile; runs `brew update`
#               then `brew bundle install --upgrade` against it (may
#               upgrade already-installed packages to newer upstream versions).
# =============================================================================

includes:
  _: ./helpers.yml

vars:
  COMPOSED_BREWFILE: '{{.STATE_DIR}}/build/Brewfile'

tasks:

  # lint-allow: cmds-without-status
  install:
    desc: "Install packages: refresh brew metadata then run brew bundle install --upgrade"
    internal: true
    # `:packages:compose` carries its own freshness-gated status block, so
    # the Brewfile is only recomposed when resolved.json (or any of its
    # upstream TOML inputs) changes. The install task itself always runs
    # so `brew update` + `brew bundle install --upgrade` execute every
    # invocation -- the "task install IS task update" contract from the
    # root Taskfile summary requires this. Both subcommands are
    # internally idempotent (no-op when nothing to do, modulo network).
    deps: [":manifest:resolve", ":packages:compose"]
    preconditions:
      - sh: test -s '{{.RESOLVED_JSON_PATH}}'
        msg: |
          resolved.json missing or empty; cannot resolve packages.brew
            run: task setup -- <machine-name>
      - sh: command -v brew >/dev/null 2>&1
        msg: "brew not on PATH -- run bootstrap.zsh first"
    # always-rerun: brew metadata refresh + upgrade must execute every
    # invocation to honour the install-is-update contract. The previous
    # `brew bundle check --no-upgrade` gate intentionally suppressed
    # upgrades; --upgrade semantics make that gate incorrect.
    status: [false]
    cmds:
      - |
        {{.DOTFILES_MESSAGES}}
        info "running brew update"
        brew update
      - |
        {{.DOTFILES_MESSAGES}}
        info "running brew bundle install --upgrade --file={{.COMPOSED_BREWFILE}}"
        brew bundle install --upgrade --file="{{.COMPOSED_BREWFILE}}"
        success "brew bundle install --upgrade complete"

  # lint-allow: cmds-without-status
  diff:
    desc: "Preview package changes: what brew bundle install would add or upgrade"
    # deps the single artifact this domain reads, not the whole build: a
    # per-domain diff must not recompose the other domains' artifacts.
    deps: [compose]
    preconditions:
      - sh: command -v brew >/dev/null 2>&1
        msg: "brew not on PATH -- run bootstrap.zsh first"
    status: [false]
    cmds:
      - |
        {{.DOTFILES_MESSAGES}}
        brewfile='{{.COMPOSED_BREWFILE}}'
        changes=0
        # Missing entries: `brew bundle check --verbose` prints one line per
        # absent dependency -- "Formula X needs to be installed.", "Cask X
        # needs to be installed.", "Tap X needs to be tapped." -- on stderr,
        # not stdout, so the stream is merged rather than discarded. The grep
        # is the filter: brew's unrelated stderr chatter (dependency-graph
        # warnings, update hints) carries neither phrase.
        missing=$(brew bundle check --no-upgrade --verbose --file="$brewfile" 2>&1 \
          | ggrep -iE 'needs to be (installed|tapped)' || true)
        if [[ -n "$missing" ]]; then
          info "packages to install:"
          printf '%s\n' "$missing" | sed 's/^/  /'
          changes=$(( changes + $(printf '%s\n' "$missing" | wc -l) ))
        fi
        # Declared entries with newer upstream versions. brew outdated covers
        # formulae and casks in one call; intersect with the declared set so
        # undeclared strays never appear in the preview.
        declared=$( { brew bundle list --formulae --file="$brewfile" 2>/dev/null; \
                      brew bundle list --casks    --file="$brewfile" 2>/dev/null; } \
          | sort -u || true)
        outdated=$(brew outdated --quiet 2>/dev/null | sort -u || true)
        upgrades=$(comm -12 <(printf '%s\n' "$declared") <(printf '%s\n' "$outdated") || true)
        if [[ -n "$upgrades" ]]; then
          info "packages to upgrade:"
          printf '%s\n' "$upgrades" | sed 's/^/  /'
          changes=$(( changes + $(printf '%s\n' "$upgrades" | wc -l) ))
        fi
        if [[ "$changes" -eq 0 ]]; then
          check "packages: no changes"
        else
          info "packages: ${changes} change(s) pending -- run 'task install'"
        fi

  compose:
    desc: "Compose per-machine Brewfile from manifest -> the build dir"
    internal: true
    deps: [":manifest:resolve"]
    preconditions:
      - sh: test -s '{{.RESOLVED_JSON_PATH}}'
        msg: |
          resolved.json missing or empty; cannot compose packages.brew
            run: task setup -- <machine-name>
    # Brewfile exists AND is at least as fresh as resolved.json -- same
    # freshness-check rationale as packages:install. resolved.json itself
    # depends on features.toml + base.toml + machines/*.toml via the
    # :manifest:resolve status block, so upstream manifest changes propagate.
    status:
      - test -f "{{.COMPOSED_BREWFILE}}"
      - |
        out=$(find "{{.RESOLVED_JSON_PATH}}" -newer "{{.COMPOSED_BREWFILE}}" -print -quit 2>/dev/null)
        [ -z "$out" ]
    cmds:
      - DOTFILEDIR="{{.ROOT_DIR}}" XDG_STATE_HOME="{{.XDG_STATE_HOME}}" zsh "{{.ROOT_DIR}}/install/compose-brewfile.zsh"

  # lint-allow: cmds-without-status
  verify:
    desc: "Verify declared packages: brew bundle check (Layer 1) + brew info artifact probe (Layer 2)"
    internal: true
    # silent: false restores stdout/stderr visibility for THIS task only --
    # the root Taskfile.yml `silent: true` would hide verify output through
    # pipes / non-TTY captures.
    silent: false
    deps: [":manifest:resolve", ":packages:compose"]
    preconditions:
      - sh: test -s '{{.RESOLVED_JSON_PATH}}'
        msg: |
          resolved.json missing or empty; cannot resolve declared packages
            run: task setup -- <machine-name>
      - sh: test -f '{{.COMPOSED_BREWFILE}}'
        msg: |
          composed Brewfile missing: {{.COMPOSED_BREWFILE}}
            run: task packages:compose first
      - sh: command -v brew >/dev/null 2>&1
        msg: "brew not on PATH -- run bootstrap.zsh first"
      - sh: command -v jq >/dev/null 2>&1
        msg: "jq not on PATH -- required for Layer 2 brew info JSON parsing"
    status: [false]
    cmds:
      - |
        {{.DOTFILES_MESSAGES}}
        failures=0

        # Layer 1: install-state gate. Reuses the EXACT same command as
        # the install task's status block so Layer 1 install-state semantics
        # are identical: install and verify share the same gate. Continue to
        # Layer 2 even on failure (enumerate-all; never short-circuit).
        info "Layer 1: brew bundle check --no-upgrade"
        if brew bundle check --no-upgrade --file="{{.COMPOSED_BREWFILE}}" >/dev/null 2>&1; then
          check "Layer 1: all declared packages installed per brew bundle"
        else
          bundle_check_output=$(brew bundle check --no-upgrade --file="{{.COMPOSED_BREWFILE}}" 2>&1 || true)
          cross "Layer 1: brew bundle check FAILED"
          printf '%s\n' "$bundle_check_output" | sed 's/^/    /' >&2
          failures=$(( failures + 1 ))
        fi

        # Layer 2 prelude: bulk brew info call. Single invocation for the
        # full installed set (~200ms on local metadata). Hard-fail if brew
        # info itself is broken -- cannot enumerate artifacts without a
        # parseable JSON response.
        info "Layer 2: bulk brew info (artifact-state gate)"
        brew_info_json=$(brew info --installed --json=v2 2>/dev/null || true)
        if ! echo "$brew_info_json" | jq -e '.casks' >/dev/null 2>&1; then
          error "brew info --installed failed -- cannot enumerate installed artifacts"
          exit 1
        fi

        # Layer 2: cask artifact probe.
        while IFS= read -r line; do
          cask_name=$(echo "$line" | ggrep -oE "^[[:space:]]*cask[[:space:]]+'[^']+'" | ggrep -oE "'[^']+'" | tr -d "'")
          [[ -z "$cask_name" ]] && continue

          cask_record=$(echo "$brew_info_json" | jq -c --arg t "$cask_name" '.casks[] | select(.token == $t)')
          if [[ -z "$cask_record" ]]; then
            cross "cask $cask_name: not installed per brew info (Layer 1 should have caught this)"
            failures=$(( failures + 1 ))
            continue
          fi

          # Walk artifacts. Track whether any checkable artifact was found.
          checkable=0
          any_miss=0
          while IFS= read -r artifact_json; do
            [[ -z "$artifact_json" ]] && continue
            kind=$(echo "$artifact_json" | jq -r 'keys[0]')
            case "$kind" in
              app)
                checkable=1
                target=$(echo "$artifact_json" | jq -r '.app[0]')
                if [[ -d "/Applications/${target}" ]]; then
                  check "cask $cask_name -> /Applications/${target}"
                else
                  cross "cask $cask_name -> /Applications/${target} NOT FOUND"
                  any_miss=$(( any_miss + 1 ))
                fi
                ;;
              binary)
                checkable=1
                # Homebrew cask binary artifacts can be:
                #   ["<source-path>"]                       -- destination name = basename(source)
                #   ["<source-path>", {"target": "<name>"}] -- destination name = target
                # The target form is required for casks like firefox where the
                # source is a wrapper script (firefox.wrapper.sh) but the
                # installed bin is "firefox".
                bin_target=$(echo "$artifact_json" | jq -r '.binary[1].target // empty')
                if [[ -n "$bin_target" ]]; then
                  bin_name="$bin_target"
                else
                  bin_path=$(echo "$artifact_json" | jq -r '.binary[0]')
                  bin_name=$(basename "$bin_path")
                fi
                if command -v "$bin_name" >/dev/null 2>&1; then
                  check "cask $cask_name -> $bin_name"
                else
                  cross "cask $cask_name -> $bin_name NOT FOUND on PATH"
                  any_miss=$(( any_miss + 1 ))
                fi
                ;;
              *)
                # pkg, manpage, uninstall, zap, installer, service, etc.
                # Informational artifacts -- not user-visible; skip.
                ;;
            esac
          done < <(echo "$cask_record" | jq -c '.artifacts[]?' 2>/dev/null || true)

          if [[ "$any_miss" -gt 0 ]]; then
            failures=$(( failures + any_miss ))
          elif [[ "$checkable" -eq 0 ]]; then
            check "cask $cask_name: installed (no checkable artifacts; Layer 1 pass)"
          fi
        done < <(ggrep -E "^[[:space:]]*cask[[:space:]]+'" "{{.COMPOSED_BREWFILE}}" || true)

        # Layer 2: formula linked_keg probe. Assert .linked_keg is non-null
        # (formula is built and linked, not just downloaded). This is the
        # top-level linked_keg on the formula record (version string of the
        # currently linked keg), NOT .installed[0].linked_keg which is
        # always null in `brew info --installed --json=v2` output.
        while IFS= read -r line; do
          formula_name=$(echo "$line" | ggrep -oE "^[[:space:]]*brew[[:space:]]+'[^']+'" | ggrep -oE "'[^']+'" | tr -d "'")
          [[ -z "$formula_name" ]] && continue

          # Extract `# verify: <bin>` override if present (defense-in-depth;
          # no bundle lines carry overrides today but the parsing pathway is
          # preserved for schema defense).
          bin_override=$(echo "$line" | ggrep -oE "#[[:space:]]*verify:[[:space:]]*[^[:space:]]+" | awk '{print $3}' || true)

          # Match by .name or .full_name: core formulae carry name == full_name,
          # but tap-qualified entries (e.g. 'oven-sh/bun/bun') appear in the
          # Brewfile as the full_name while brew info reports .name as the leaf.
          formula_record=$(echo "$brew_info_json" | jq -c --arg n "$formula_name" '.formulae[] | select(.name == $n or .full_name == $n)')
          if [[ -z "$formula_record" ]]; then
            cross "formula $formula_name: not installed per brew info"
            failures=$(( failures + 1 ))
            continue
          fi

          # keg-only formulae (e.g., whois on macOS, which would shadow
          # /usr/bin/whois) are intentionally not symlinked into the Homebrew
          # prefix; .linked_keg is always null. Layer 1 already confirmed
          # installation, so accept keg-only formulae without the linked_keg
          # probe.
          keg_only=$(echo "$formula_record" | jq -r '.keg_only // false')
          linked_keg=$(echo "$formula_record" | jq -r '.linked_keg // empty')
          if [[ "$keg_only" == "true" ]]; then
            check "formula $formula_name: installed (keg-only; Layer 1 pass)"
            continue
          fi
          if [[ -z "$linked_keg" ]]; then
            cross "formula $formula_name: installed but not linked (linked_keg=null)"
            failures=$(( failures + 1 ))
            continue
          fi

          if [[ -n "$bin_override" ]]; then
            if command -v "$bin_override" >/dev/null 2>&1; then
              check "formula $formula_name -> linked_keg=$(basename "$linked_keg") + $bin_override"
            else
              cross "formula $formula_name -> $bin_override NOT FOUND on PATH (override)"
              failures=$(( failures + 1 ))
            fi
          else
            check "formula $formula_name -> linked_keg=$(basename "$linked_keg")"
          fi
        done < <(ggrep -E "^[[:space:]]*brew[[:space:]]+'" "{{.COMPOSED_BREWFILE}}" || true)

        # MAS layer. No brew-info equivalent for App Store apps. Skip
        # gracefully if mas is not on PATH (mas is declared in
        # manifests/base.toml so should always be installed
        # on a fully-converged machine).
        if ! command -v mas >/dev/null 2>&1; then
          warn "MAS layer skipped: mas not on PATH"
        else
          mas_installed=$(mas list 2>/dev/null | awk '{print $1}' | sort -u || true)
          while IFS= read -r line; do
            mas_name=$(echo "$line" | ggrep -oE "^[[:space:]]*mas[[:space:]]+'[^']+'" | ggrep -oE "'[^']+'" | tr -d "'")
            [[ -z "$mas_name" ]] && continue
            mas_id=$(echo "$line" | ggrep -oE "id:[[:space:]]*[0-9]+" | awk '{print $2}')
            [[ -z "$mas_id" ]] && continue
            if ! echo "$mas_installed" | ggrep -qx "$mas_id"; then
              cross "mas $mas_name (id $mas_id): not installed per mas list"
              failures=$(( failures + 1 ))
              continue
            fi
            if [[ -d "/Applications/${mas_name}.app" ]]; then
              check "mas $mas_name -> /Applications/${mas_name}.app"
            else
              cross "mas $mas_name -> /Applications/${mas_name}.app NOT FOUND"
              failures=$(( failures + 1 ))
            fi
          done < <(ggrep -E "^[[:space:]]*mas[[:space:]]+'" "{{.COMPOSED_BREWFILE}}" || true)
        fi

        if [[ "$failures" -gt 0 ]]; then
          cross "${failures} package(s) failed verify"
          exit "$failures"
        fi
        success "all declared packages verified (Layer 1 + Layer 2 + MAS)"
        exit 0

  # lint-allow: cmds-without-status
  audit:
    desc: "Audit installed brew formulae/casks/mas + vscode/cargo/uv/npm vs declared. Non-blocking; --strict exits non-zero."
    deps: [":manifest:resolve"]
    preconditions:
      - sh: test -s '{{.RESOLVED_JSON_PATH}}'
        msg: |
          resolved.json missing or empty; cannot determine declared packages
            run: task setup -- <machine-name>
      - sh: test -f '{{.COMPOSED_BREWFILE}}'
        msg: |
          composed Brewfile missing: {{.COMPOSED_BREWFILE}}
            run: task packages:compose first
      - sh: command -v brew >/dev/null 2>&1
        msg: "brew not on PATH -- run bootstrap.zsh first"
    # always-rerun: drift detection is a fresh measurement each invocation.
    status: [false]
    cmds:
      - |
        {{.DOTFILES_MESSAGES}}

        # Parse --strict from CLI_ARGS. Caller form: task packages:audit -- --strict
        # `case` rather than a `[[ ]] &&` chain: an unmatched `&&` list is a
        # non-zero statement, and under errexit that aborts the task before it
        # reaches the drift scan. `case` returns 0 when nothing matches.
        strict=0
        for arg in {{.CLI_ARGS}}; do
          case "$arg" in
            --strict) strict=1 ;;
          esac
        done

        # Declared sets (extracted from the composed Brewfile).
        bf='{{.COMPOSED_BREWFILE}}'

        # `brew bundle list --<type>` evaluates the Brewfile DSL in Ruby, so
        # the declared set is authoritative rather than a regex over generated
        # text. Sorted because the comm compares below require sorted input.
        # `|| true` on each: a type with zero entries exits non-zero, which
        # under errexit+pipefail (set at the root Taskfile) would abort the
        # entire audit silently. Machines with `mas = []` / `casks = []` are
        # legitimate (e.g., atium headless), so an empty section must yield an
        # empty declared-set, not a hard fail.
        declared_formulae=$(brew bundle list --formulae --file="$bf" 2>/dev/null | sort -u || true)
        declared_casks=$(brew bundle list --casks     --file="$bf" 2>/dev/null | sort -u || true)
        declared_vscode=$(brew bundle list --vscode   --file="$bf" 2>/dev/null | sort -u || true)
        declared_cargo=$(brew bundle list --cargo     --file="$bf" 2>/dev/null | sort -u || true)
        declared_uv=$(brew bundle list --uv           --file="$bf" 2>/dev/null | sort -u || true)
        declared_npm=$(brew bundle list --npm         --file="$bf" 2>/dev/null | sort -u || true)

        # mas is compared by App Store id (that is what `mas list` reports),
        # and `brew bundle list --mas` prints names, so this one stays a grep.
        declared_mas=$(ggrep -E "^[[:space:]]*mas[[:space:]]+'" "$bf" \
          | ggrep -oE "id:[[:space:]]*[0-9]+" \
          | awk '{print $2}' \
          | sort -u || true)

        # `brew leaves` = top-level formulae only (catches manual installs,
        # not transitive deps).
        installed_formulae=$(brew leaves 2>/dev/null | sort -u || true)
        installed_casks=$(brew list --cask 2>/dev/null | sort -u || true)
        if command -v mas >/dev/null 2>&1; then
          installed_mas=$(mas list 2>/dev/null | awk '{print $1}' | sort -u || true)
        else
          warn "mas not on PATH -- skipping MAS audit section"
          installed_mas=""
        fi

        # Installed sets for the non-brew managers. Each is gated on its CLI
        # being present (a server without the vscode flag has no `code`); a
        # missing CLI yields an empty installed-set so the section skips
        # cleanly. The skip is announced only when something was declared, so
        # a machine that uses none of these stays quiet.
        if command -v code >/dev/null 2>&1; then
          installed_vscode=$(code --list-extensions 2>/dev/null | sort -u || true)
        else
          installed_vscode=""
          if [[ -n "$declared_vscode" ]]; then
            warn "code not on PATH -- skipping vscode audit section"
          fi
        fi
        if command -v cargo >/dev/null 2>&1; then
          # `cargo install --list`: crate header lines are unindented and end
          # in ":"; the crate name is field 1. Indented binary lines are skipped.
          installed_cargo=$(cargo install --list 2>/dev/null \
            | awk '/^[^[:space:]].*:$/{print $1}' | sort -u || true)
        else
          installed_cargo=""
          if [[ -n "$declared_cargo" ]]; then
            warn "cargo not on PATH -- skipping cargo audit section"
          fi
        fi
        if command -v uv >/dev/null 2>&1; then
          # `uv tool list`: tool lines look like "name vX.Y.Z"; indented "- bin"
          # lines and status messages are filtered by the version anchor.
          installed_uv=$(uv tool list 2>/dev/null \
            | awk '/^[A-Za-z0-9._-]+ v[0-9]/{print $1}' | sort -u || true)
        else
          installed_uv=""
          if [[ -n "$declared_uv" ]]; then
            warn "uv not on PATH -- skipping uv audit section"
          fi
        fi
        if command -v npm >/dev/null 2>&1; then
          # `npm ls -g --depth=0 --json`: top-level global package names live
          # under .dependencies. The node formula ships `npm`/`corepack` as
          # baseline globals (never declared), so exclude them to avoid
          # mis-flagging them as drift.
          installed_npm=$(npm ls -g --depth=0 --json 2>/dev/null \
            | jq -r '.dependencies // {} | keys[]' \
            | ggrep -vxE 'npm|corepack' | sort -u || true)
        else
          installed_npm=""
          if [[ -n "$declared_npm" ]]; then
            warn "npm not on PATH -- skipping npm audit section"
          fi
        fi

        total_drift=0

        # `comm -23 <installed> <declared>` = present in installed but absent
        # from declared = drift. report_drift increments the outer total_drift
        # (plain shell function, not a subshell -- it shares this block's scope).
        report_drift() {
          local label="$1" installed="$2" declared="$3" item
          for item in $(comm -23 <(echo "$installed") <(echo "$declared")); do
            [[ -z "$item" ]] && continue
            warn "drift: $label $item (installed but not declared)"
            total_drift=$(( total_drift + 1 ))
          done
        }

        report_drift formula "$installed_formulae" "$declared_formulae"
        report_drift cask    "$installed_casks"    "$declared_casks"
        report_drift mas     "$installed_mas"      "$declared_mas"
        report_drift vscode  "$installed_vscode"   "$declared_vscode"
        report_drift cargo   "$installed_cargo"    "$declared_cargo"
        report_drift uv      "$installed_uv"       "$declared_uv"
        report_drift npm     "$installed_npm"      "$declared_npm"

        # Taps and trust grants. Neither is an installed package, so neither is
        # visible to the report_drift comparisons above. A tap is a
        # code-execution boundary: an undeclared one, or a trust grant for one,
        # is drift in the same sense an undeclared cask is.
        tmp_declared=$(mktemp "${TMPDIR:-/tmp}/dotfiles-declared-taps.XXXXXX")
        tmp_installed=$(mktemp "${TMPDIR:-/tmp}/dotfiles-installed-taps.XXXXXX")
        tmp_trust=$(mktemp "${TMPDIR:-/tmp}/dotfiles-trust.XXXXXX")
        # EXIT only: the mvdan/sh interpreter go-task runs does not accept
        # INT/TERM signal names in trap.
        trap 'rm -f "$tmp_declared" "$tmp_installed" "$tmp_trust"' EXIT

        brew bundle list --taps --file="$bf" 2>/dev/null | sort -u > "$tmp_declared" || true
        brew tap 2>/dev/null | sort -u > "$tmp_installed" || true
        # `brew trust --json v1` is the stable, normalized view of the trust
        # store -- always all four keys. The on-disk trust.json is a private
        # format (only non-empty keys, differently named) and is never parsed.
        brew trust --json v1 2>/dev/null > "$tmp_trust" || true

        while IFS= read -r finding; do
          [[ -z "$finding" ]] && continue
          warn "drift: ${finding}"
          total_drift=$(( total_drift + 1 ))
        done < <(zsh "{{.ROOT_DIR}}/install/packages-trust-scan.zsh" \
          "$tmp_declared" "$tmp_installed" "$tmp_trust")

        rm -f "$tmp_declared" "$tmp_installed" "$tmp_trust"
        trap - EXIT

        if [[ "$total_drift" -eq 0 ]]; then
          success "no drift detected"
          exit 0
        fi
        info "to fix: declare in the machine manifest (or manifests/base.toml / a feature flag) if wanted, or uninstall if not"
        if [[ "$strict" -eq 1 ]]; then
          cross "${total_drift} drift item(s) detected (--strict)"
          exit 1
        fi
        warn "${total_drift} drift item(s) detected (non-blocking; --strict to fail)"
        exit 0

  # lint-allow: cmds-without-status
  vulns:
    desc: "Check declared packages against OSV.dev. Non-blocking; --strict exits non-zero."
    deps: [":manifest:resolve", ":packages:compose"]
    preconditions:
      - sh: test -f '{{.COMPOSED_BREWFILE}}'
        msg: |
          composed Brewfile missing: {{.COMPOSED_BREWFILE}}
            run: task packages:compose first
      - sh: command -v brew >/dev/null 2>&1
        msg: "brew not on PATH -- run bootstrap.zsh first"
      - sh: command -v jq >/dev/null 2>&1
        msg: "jq not on PATH -- required to count findings from brew vulns --json"
    # always-rerun: a vulnerability scan is a fresh measurement each invocation.
    status: [false]
    cmds:
      - |
        {{.DOTFILES_MESSAGES}}

        # Caller forms: task packages:vulns -- --strict --severity=low
        # `case` rather than a `[[ ]] &&` chain: an unmatched `&&` list is a
        # non-zero statement, and under errexit that aborts the task before it
        # reaches the scan. `case` returns 0 when nothing matches.
        strict=0
        severity=high
        for arg in {{.CLI_ARGS}}; do
          case "$arg" in
            --strict) strict=1 ;;
            --severity=*) severity="${arg#--severity=}" ;;
          esac
        done

        info "brew vulns --brewfile (severity >= ${severity})"

        # --json is the machine-readable form: a JSON array, empty when clean.
        # brew vulns exits 1 whenever findings exist, so every invocation needs
        # `|| true` under the root Taskfile's errexit; the array length, not the
        # exit code, is what distinguishes "clean" from "brew itself broke".
        findings=$(brew vulns --brewfile="{{.COMPOSED_BREWFILE}}" --severity="$severity" --json 2>/dev/null || true)
        if ! echo "$findings" | jq -e 'type == "array"' >/dev/null 2>&1; then
          error "brew vulns returned no parseable JSON -- cannot assess vulnerabilities"
          exit 1
        fi

        count=$(echo "$findings" | jq -r 'length')
        if [[ "$count" -eq 0 ]]; then
          success "no known vulnerabilities at severity >= ${severity}"
          exit 0
        fi

        # Human-readable rerun: the JSON carries the detail, but the plain
        # form is what an operator wants to read.
        { brew vulns --brewfile="{{.COMPOSED_BREWFILE}}" --severity="$severity" 2>&1 || true; } \
          | sed 's/^/    /'

        info "to fix: task install (upgrades to a patched version if one is published)"
        if [[ "$strict" -eq 1 ]]; then
          cross "${count} vulnerability finding(s) at severity >= ${severity} (--strict)"
          exit 1
        fi
        warn "${count} vulnerability finding(s) at severity >= ${severity} (non-blocking; --strict to fail)"
        exit 0

  # lint-allow: cmds-without-status
  validate:
    desc: "Validate packages layer (wraps packages:verify)"
    internal: true
    cmds:
      - task: verify
